<!DOCTYPE html>

    <!-- 🟢 ১. অ্যাপ ওWebView ক্যাশ বন্ধ করার মেটা ট্যাগ -->

    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logoo 192.png" />

    <title>Save Money</title>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <!-- 🟢 ২. সার্ভিস ওয়ার্কার আনরেজিস্টার এবং পুরাতন ক্যাশ ডিলিট করার কোড -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            registration.unregister(); // পুরোনো সার্ভিস ওয়ার্কার আনইনস্টল করবে
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (let name of names) {
            caches.delete(name); // সেভ থাকা সমস্ত পুরোনো ক্যাশ ডিলিট করবে
          }
        });
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <!-- Firebase App এবং Messaging SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-messaging-compat.js"></script>

    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyDqgsE1mND4pl6ZxlExPOW7zecHW3x_H94",
        authDomain: "savemoney-a2615.firebaseapp.com",
        projectId: "savemoney-a2615",
        storageBucket: "savemoney-a2615.firebasestorage.app",
        messagingSenderId: "642246363002",
        appId: "1:642246363002:web:8ae296cb0131a28c7ff8c3"
      };

      firebase.initializeApp(firebaseConfig);
      const messaging = firebase.messaging();

      function requestNotificationPermission() {
        console.log('পারমিশন চাওয়া হচ্ছে...');
        Notification.requestPermission().then((permission) => {
          if (permission === 'granted') {
            console.log('নোটিফিকেশন পারমিশন পাওয়া গেছে।');
            messaging.getToken({ vapidKey: 'YOUR_GENERATED_VAPID_KEY' })
              .then((currentToken) => {
                if (currentToken) {
                  console.log('আপনার FCM Token:', currentToken);
                } else {
                  console.log('কোনো রেজিস্ট্রেশন টোকেন পাওয়া যায়নি। পারমিশন দিন।');
                }
              }).catch((err) => {
                console.log('টোকেন নেওয়ার সময় ভুল হয়েছে: ', err);
              });
          } else {
            console.log('ইউজার নোটিফিকেশন পারমিশন দেননি।');
          }
        });
      }

      window.addEventListener('load', function() {
        requestNotificationPermission();
      });

      messaging.onMessage((payload) => {
        console.log('ফোরগ্রাউন্ড মেসেজ:', payload);
        alert(`${payload.notification.title}: ${payload.notification.body}`);
      });
    </script>
  </body>
</html>
